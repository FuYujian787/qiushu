<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>注册 - 求书 | 校园二手书平台</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
<style>
        body {
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .btn-purple {
            background-color: #7c3aed;
        }
        .btn-purple:hover {
            background-color: #6d28d9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
<div class="max-w-md w-full">
<!-- 注册卡片 -->
<div class="login-card p-10 flex flex-col relative overflow-hidden">
<div class="flex justify-between items-center mb-8">
<h2 class="text-2xl font-bold text-gray-800">注册新账号</h2>
<a class="text-gray-400 hover:text-gray-600" href="index.html">
<iconify-icon icon="line-md:close" width="24"></iconify-icon>
</a>
</div>
<div class="space-y-4 mb-8">
<button class="w-full py-3 px-4 border border-gray-200 rounded-lg flex items-center justify-center space-x-3 hover:bg-gray-50 transition-colors">
<iconify-icon class="text-gray-600" icon="mdi:school-outline" width="24"></iconify-icon>
<span class="text-gray-700">浙大通行证注册</span>
</button>
<button class="w-full py-3 px-4 border border-gray-200 rounded-lg flex items-center justify-center space-x-3 hover:bg-gray-50 transition-colors">
<iconify-icon class="text-gray-600" icon="mdi:cellphone" width="24"></iconify-icon>
<span class="text-gray-700">手机号注册</span>
</button>
<button class="w-full py-3 px-4 border border-gray-200 rounded-lg flex items-center justify-center space-x-3 hover:bg-gray-50 transition-colors">
<iconify-icon class="text-green-500" icon="ri:wechat-fill" width="24"></iconify-icon>
<span class="text-gray-700">微信注册</span>
</button>
<button class="w-full py-3 px-4 border border-gray-200 rounded-lg flex items-center justify-center space-x-3 hover:bg-gray-50 transition-colors">
<iconify-icon class="text-blue-500" icon="ant-design:dingtalk-outlined" width="24"></iconify-icon>
<span class="text-gray-700">钉钉注册</span>
</button>
</div>
<div class="flex items-start mb-8">
<input class="mt-1 w-4 h-4 text-purple-600 rounded border-gray-300 focus:ring-purple-500" id="reg-agree" type="checkbox"/>
<label class="ml-2 text-sm text-gray-500" for="reg-agree">
                    我已阅读并同意 <a class="text-purple-600" href="#">《服务协议》</a> 和 <a class="text-purple-600" href="#">《隐私协议》</a>
</label>
</div>
<button class="w-full py-3 btn-purple text-white rounded-lg font-medium transition-colors mb-4 shadow-lg shadow-purple-200" onclick="window.location.href='login.html'">
                注册
            </button>
<p class="text-center text-sm text-gray-500">
                已有账号？ <a class="text-purple-600 font-medium hover:underline" href="login.html">前往登录</a>
</p>
</div>
</div>
<!-- 底部版权信息 -->
<div class="mt-8 text-gray-400 text-xs">
        © 2026 求书校园二手书平台 · 当前日期: 2026年04月20日
    </div>
</body>
</html>
