<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>浙大通行证登录 - 教务查询</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 0 20px; }
    h1 { color: #1a3c6e; border-bottom: 2px solid #1a3c6e; padding-bottom: 10px; }
    label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    input:focus { border-color: #1a3c6e; outline: none; box-shadow: 0 0 5px rgba(26,60,110,0.3); }
    button { 
      margin-top: 20px; 
      padding: 12px 30px; 
      background: #1a3c6e; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-size: 16px; 
      cursor: pointer;
      width: 100%;
    }
    button:hover { background: #2a5a9e; }
    button:disabled { background: #999; cursor: not-allowed; }
    #result { margin-top: 20px; white-space: pre-wrap; background: #f5f5f5; padding: 15px; border-radius: 4px; min-height: 50px; }
    #result.success { background: #e8f5e9; border: 1px solid #a5d6a7; }
    #result.error { background: #ffebee; border: 1px solid #ef9a9a; }
    #result.loading { background: #fff8e1; border: 1px solid #ffe082; }
    .grade-item { padding: 8px 0; border-bottom: 1px solid #e0e0e0; }
    .grade-item:last-child { border-bottom: none; }
    .grade-course { font-weight: bold; }
    .grade-detail { color: #666; font-size: 13px; margin-top: 3px; }
    .grade-score { color: #1a3c6e; font-weight: bold; }
    .count-badge { 
      display: inline-block; 
      background: #1a3c6e; 
      color: white; 
      padding: 3px 10px; 
      border-radius: 12px; 
      font-size: 13px;
      margin-bottom: 10px;
    }
    .step-log { 
      font-size: 12px; 
      color: #888; 
      margin: 2px 0;
      padding-left: 10px;
      border-left: 2px solid #ddd;
    }
    .step-log.active { color: #1a3c6e; border-left-color: #1a3c6e; }
    .step-log.done { color: #2e7d32; border-left-color: #2e7d32; }
    .step-log.error { color: #c62828; border-left-color: #c62828; }
  </style>
</head>
<body>
  <h1>🔐 浙大通行证登录</h1>
  <p style="color:#666;font-size:14px;">登录后自动查询主修成绩</p>
  
  <label>学号</label>
  <input type="text" id="username" placeholder="输入学号">
  <label>密码</label>
  <input type="password" id="password" placeholder="输入密码">
  <button id="loginBtn" onclick="login()">登录并查询主修成绩</button>
  
  <div id="result">请输入学号和密码后点击登录</div>

  <script>
    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const resultDiv = document.getElementById('result');
      const loginBtn = document.getElementById('loginBtn');
      
      if (!username || !password) {
        resultDiv.className = 'error';
        resultDiv.textContent = '请输入学号和密码';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';
      resultDiv.className = 'loading';
      resultDiv.innerHTML = '<div class="step-log active">🔄 正在连接服务器...</div>';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        resultDiv.innerHTML += '<div class="step-log done">✅ 服务器响应成功</div>';
        
        const data = await response.json();
        
        if (data.success) {
          resultDiv.className = 'success';
          let html = `<span class="count-badge">共 ${data.count} 门课程</span>`;
          data.grades.forEach(g => {
            const scoreClass = parseFloat(g.score) >= 60 ? 'grade-score' : '';
            html += `<div class="grade-item">
              <div class="grade-course">${g.course}</div>
              <div class="grade-detail">
                学分：${g.credit} | 
                成绩：<span class="${scoreClass}">${g.score}</span> | 
                GPA：${g.gpa || '无'}
              </div>
            </div>`;
          });
          resultDiv.innerHTML = html;
        } else {
          resultDiv.className = 'error';
          resultDiv.innerHTML = '<div class="step-log error">❌ 登录失败：' + data.message + '</div>';
        }
      } catch (e) {
        resultDiv.className = 'error';
        resultDiv.innerHTML = '<div class="step-log error">❌ 网络错误：' + e.message + '</div>';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录并查询主修成绩';
      }
    }
  </script>
</body>
</html>
