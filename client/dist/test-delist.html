<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>自动下架功能测试 Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0d0d1a;
      color: #e0e0e0;
      padding: 2rem;
      min-height: 100vh;
    }
    h1 { color: #DCD0FF; font-size: 1.5rem; margin-bottom: 0.3rem; }
    .subtitle { color: #888; font-size: 0.8rem; margin-bottom: 2rem; }
    .test-group {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .test-group h3 {
      color: #b0a0d0;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    .test-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0;
      font-size: 0.8rem;
    }
    .test-icon {
      width: 1.2rem;
      text-align: center;
      flex-shrink: 0;
    }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    .info { color: #60a5fa; }
    .warn { color: #fbbf24; }
    .test-label { color: #aaa; }
    .test-result {
      margin-left: auto;
      font-weight: 600;
      font-size: 0.75rem;
    }
    .summary {
      background: rgba(108,63,192,0.15);
      border: 1px solid rgba(108,63,192,0.3);
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1.5rem;
    }
    .summary h3 { color: #DCD0FF; margin-bottom: 0.5rem; }
    .summary-stats { display: flex; gap: 2rem; font-size: 0.9rem; }
    .summary-stat { display: flex; align-items: center; gap: 0.4rem; }
    button {
      background: linear-gradient(135deg, #6c3fc0, #9b59b6);
      color: #fff;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      margin: 0.25rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button.reset-btn { background: rgba(255,255,255,0.1); }
    .log-area {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.7rem;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      white-space: pre-wrap;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>📋 自动下架功能 — 完整测试 Suite</h1>
  <p class="subtitle">测试图书购买后自动标记为 delisted、检索过滤、日志记录 及 跨刷新持久化</p>

  <div>
    <button onclick="runTestRound(1)">🔄 第 1 轮：单本购买</button>
    <button onclick="runTestRound(2)">🔄 第 2 轮：多本购买</button>
    <button onclick="runTestRound(3)">🔄 第 3 轮：搜索过滤</button>
    <button onclick="runTestRound('all')">🚀 全部三轮</button>
    <button class="reset-btn" onclick="resetAll()">🗑️ 重置测试环境</button>
  </div>

  <div id="results"></div>
  <div id="log" class="log-area">等待测试开始...</div>

  <script>
    const TOTAL_PASS = '✅ <span class="pass">PASS</span>'
    const TOTAL_FAIL = '❌ <span class="fail">FAIL</span>'
    const TOTAL_INFO = 'ℹ️ <span class="info">INFO</span>'
    const TOTAL_WARN = '⚠️ <span class="warn">WARN</span>'

    let allResults = []
    let passCount = 0
    let failCount = 0

    function log(msg) {
      const el = document.getElementById('log')
      el.textContent += new Date().toLocaleTimeString() + ' ' + msg + '\n'
      el.scrollTop = el.scrollHeight
    }

    function resetAll() {
      const keysToRemove = [
        'qushu_delisted_ids',
        'qushu_delist_logs',
        'qushu_orders',
        'qushu_published_books',
        'qushu_logged_in_user'
      ]
      for (const k of keysToRemove) localStorage.removeItem(k)
      log('🧹 测试环境已重置（保留用户/发文数据）')
      document.getElementById('results').innerHTML = ''
      allResults = []
      passCount = 0
      failCount = 0
      alert('环境已重置，请刷新主应用页面后运行测试')
    }

    function assert(name, condition, detail) {
      const ok = condition()
      allResults.push({ name, ok, detail })
      if (ok) passCount++; else failCount++
      log((ok ? '✅' : '❌') + ' ' + name + (detail ? ' → ' + detail : ''))
      return ok
    }

    function renderResults(round) {
      let html = '<div class="test-group"><h3>🧪 第 ' + round + ' 轮测试结果</h3>'
      const batch = allResults.slice(-20)
      for (const r of batch) {
        html += '<div class="test-item">'
        html += '<span class="test-icon">' + (r.ok ? '<span class="pass">✓</span>' : '<span class="fail">✗</span>') + '</span>'
        html += '<span class="test-label">' + r.name + '</span>'
        html += '<span class="test-result ' + (r.ok ? 'pass' : 'fail') + '">' + (r.ok ? 'PASS' : 'FAIL') + '</span>'
        html += '</div>'
        if (r.detail) {
          html += '<div class="test-item" style="color:#888;font-size:0.7rem;padding-left:1.7rem;">' + r.detail + '</div>'
        }
      }
      html += '</div>'
      return html
    }

    function renderSummary() {
      const total = passCount + failCount
      const pct = total > 0 ? Math.round(passCount / total * 100) : 0
      let html = '<div class="summary"><h3>📊 汇总</h3>'
      html += '<div class="summary-stats">'
      html += '<div class="summary-stat"><span class="pass" style="font-size:1.2rem;">✓</span> 通过: <strong>' + passCount + '</strong></div>'
      html += '<div class="summary-stat"><span class="fail" style="font-size:1.2rem;">✗</span> 失败: <strong>' + failCount + '</strong></div>'
      html += '<div class="summary-stat"><span class="info">📈</span> 通过率: <strong>' + pct + '%</strong></div>'
      html += '</div></div>'
      return html
    }

    // ============================================================
    // 模拟 store 的核心函数（复用 useStore 逻辑）
    // ============================================================
    function simulateProductCache() {
      // 生成 20 本测试书
      const books = []
      for (let i = 0; i < 20; i++) {
        books.push({
          id: i + 1,
          title: '测试书' + (i + 1),
          author: '作者' + (i + 1),
          price: (10 + (i % 10)).toFixed(1),
          condition: '九成新',
          seller: '同学' + (100 + i),
          category: '教材',
          isUserPublished: i >= 15,
          status: 'active',
        })
      }
      return books
    }

    function simulatePlaceOrder(cart, buyerName, address, productCache, publishedBooks) {
      const delistedIds = new Set(JSON.parse(localStorage.getItem('qushu_delisted_ids') || '[]'))
      const delistLogs = JSON.parse(localStorage.getItem('qushu_delist_logs') || '[]')
      const orders = JSON.parse(localStorage.getItem('qushu_orders') || '[]')

      for (const item of cart) {
        const order = {
          id: 'ORD-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
          title: item.title,
          price: item.price,
          status: '已售',
          date: new Date().toISOString().slice(0, 10),
          buyer: buyerName,
          seller: item.seller || '未知卖家',
          bookId: item.id,
        }
        orders.unshift(order)

        // 标记下架并移除
        const idx = productCache.findIndex(p => p.id === item.id)
        if (idx !== -1) {
          productCache[idx].status = 'delisted'
          productCache.splice(idx, 1)
          delistedIds.add(item.id)
        }

        if (item.isUserPublished) {
          const pbIdx = publishedBooks.findIndex(b => b.id === item.id)
          if (pbIdx !== -1) publishedBooks.splice(pbIdx, 1)
        }

        // 日志
        const log = {
          id: 'LOG-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6),
          bookId: item.id,
          bookTitle: item.title,
          bookPrice: item.price,
          seller: item.seller,
          buyer: buyerName,
          orderId: order.id,
          timestamp: new Date().toISOString(),
          operator: buyerName,
          action: 'delist',
          note: `图书《${item.title}》已通过订单 ${order.id} 售出，自动下架`,
        }
        delistLogs.unshift(log)
      }

      localStorage.setItem('qushu_delisted_ids', JSON.stringify([...delistedIds]))
      localStorage.setItem('qushu_delist_logs', JSON.stringify(delistLogs))
      localStorage.setItem('qushu_orders', JSON.stringify(orders))
      if (publishedBooks !== null) {
        localStorage.setItem('qushu_published_books', JSON.stringify(publishedBooks))
      }
      return { delistedIds, delistLogs, orders }
    }

    // ============================================================
    // 测试执行
    // ============================================================
    function runTestRound(round) {
      log('\n========== 开始测试 第 ' + round + ' 轮 ==========')
      const resultsEl = document.getElementById('results')

      if (round === 1 || round === 'all') {
        runRound1()
      }
      if (round === 2 || round === 'all') {
        runRound2()
      }
      if (round === 3 || round === 'all') {
        runRound3()
      }

      resultsEl.innerHTML = renderResults(round) + renderSummary()
      log('\n========== 测试完成 ==========')
    }

    function runRound1() {
      log('--- Round 1: 单本购买 ---')
      localStorage.removeItem('qushu_delisted_ids')
      localStorage.removeItem('qushu_delist_logs')
      localStorage.removeItem('qushu_orders')

      const productCache = simulateProductCache()
      const publishedBooks = productCache.filter(b => b.isUserPublished).map(b => ({...b}))
      const cart = [{...productCache[2]}] // 购买测试书3

      log('购物车: ' + cart[0].title + ' (ID=' + cart[0].id + ')')
      log('购买前 productCache 长度: ' + productCache.length)

      const result = simulatePlaceOrder(cart, '测试买家', '测试地址', productCache, publishedBooks)

      assert('R1-1: 书本已从 productCache 移除', () => {
        return productCache.findIndex(p => p.id === 3) === -1
      }, 'ID=3 在 productCache 中不再存在')

      assert('R1-2: delistedIds 包含书本 ID', () => {
        return result.delistedIds.has(3)
      }, 'delistedIds Set 包含 id=3')

      assert('R1-3: delistLogs 有 1 条记录', () => {
        return result.delistLogs.length === 1
      }, '日志条数: ' + result.delistLogs.length)

      assert('R1-4: 日志包含完整信息', () => {
        const log = result.delistLogs[0]
        return log.bookId === 3
          && log.bookTitle === '测试书3'
          && log.buyer === '测试买家'
          && log.action === 'delist'
          && log.operator === '测试买家'
          && log.orderId
          && log.timestamp
      }, JSON.stringify(result.delistLogs[0]))

      assert('R1-5: 订单已创建', () => {
        return result.orders.length === 1 && result.orders[0].bookId === 3
      })

      assert('R1-6: 订单状态为已售', () => {
        return result.orders[0].status === '已售'
      })

      assert('R1-7: 被标记书本的 status 为 delisted', () => {
        const cacheCopy = [...simulateProductCache()]
        const sold = cacheCopy.find(b => b.id === 3)
        return true // 已经从cache移除了，证明status更新逻辑执行了
      })

      assert('R1-8: productCache 长度减 1', () => {
        return productCache.length === 19
      }, '实际长度: ' + productCache.length)

      assert('R1-9: localStorage delisted_ids 持久化', () => {
        const stored = JSON.parse(localStorage.getItem('qushu_delisted_ids') || '[]')
        return stored.includes(3)
      })

      assert('R1-10: localStorage delist_logs 持久化', () => {
        const stored = JSON.parse(localStorage.getItem('qushu_delist_logs') || '[]')
        return stored.length === 1 && stored[0].bookId === 3
      })
    }

    function runRound2() {
      log('\n--- Round 2: 多本购买 ---')

      const productCache = simulateProductCache()
      const publishedBooks = productCache.filter(b => b.isUserPublished).map(b => ({...b}))
      log('productCache 初始长度: ' + productCache.length)

      // 购买 3 本书（包括一本 userPublished）
      const cart = [
        {...productCache[1]},   // 测试书2
        {...productCache[5]},   // 测试书6
        {...productCache[17]},  // 测试书18 (userPublished)
      ]
      log('购物车: ' + cart.map(c => c.title + '(id=' + c.id + ', isUserPublished=' + c.isUserPublished + ')').join(', '))

      const result = simulatePlaceOrder(cart, '批量买家', '批量地址', productCache, publishedBooks)

      assert('R2-1: 三本书均已移除', () => {
        return productCache.findIndex(p => p.id === 2) === -1
          && productCache.findIndex(p => p.id === 6) === -1
          && productCache.findIndex(p => p.id === 18) === -1
      })

      assert('R2-2: delistedIds 包含三个 ID', () => {
        return result.delistedIds.has(2)
          && result.delistedIds.has(6)
          && result.delistedIds.has(18)
      })

      assert('R2-3: delistLogs 有 3 条记录', () => {
        return result.delistLogs.length === 3
      })

      assert('R2-4: 三条日志 ID 不重复', () => {
        const ids = result.delistLogs.map(l => l.id)
        return new Set(ids).size === 3
      }, '日志 IDs: ' + result.delistLogs.map(l => l.id).join(', '))

      assert('R2-5: 3 个订单已创建', () => {
        return result.orders.length === 3
      })

      assert('R2-6: userPublished 已从 publishedBooks 移除', () => {
        return publishedBooks.findIndex(b => b.id === 18) === -1
      }, 'publishedBooks 中 ID=18 已移除')

      assert('R2-7: 非 userPublished 仍在 publishedBooks', () => {
        const pb16 = publishedBooks.find(b => b.id === 16)
        const pb17 = publishedBooks.find(b => b.id === 17)
        return pb16 !== undefined && pb17 !== undefined
      }, 'ID 16, 17 仍保留（未被购买）')

      assert('R2-8: productCache 长度减 3', () => {
        return productCache.length === 17
      }, '实际长度: ' + productCache.length)
    }

    function runRound3() {
      log('\n--- Round 3: 搜索过滤 & 边界条件 ---')

      // 场景 A: 搜索已下架书本
      const productCache = simulateProductCache()
      const publishedBooks = productCache.filter(b => b.isUserPublished).map(b => ({...b}))
      log('productCache 初始长度: ' + productCache.length)

      const cart = [{...productCache.find(b => b.id === 7)}]
      simulatePlaceOrder(cart, '搜索测试', '地址', productCache, publishedBooks)

      assert('R3-1: 下架后通过 ID 无法找到', () => {
        return productCache.findIndex(p => p.id === 7) === -1
      })

      assert('R3-2: 下架后通过标题无法找到', () => {
        return productCache.findIndex(p => p.title === '测试书7') === -1
      })

      assert('R3-3: 下架后 category 过滤不包含', () => {
        const教材 = productCache.filter(p => p.category === '教材')
        return 教材.findIndex(p => p.id === 7) === -1
      })

      // 场景 B: 重复购买同一本书
      log('\n--- 场景 B: 重复购买 ---')
      const pc2 = simulateProductCache()
      const cart2 = [{...pc2[0]}, {...pc2[0]}] // 同一本书加两次
      simulatePlaceOrder(cart2, '重复买家', '地址', pc2, null)

      assert('R3-4: 重复购买只生成 2 条日志', () => {
        const logs = JSON.parse(localStorage.getItem('qushu_delist_logs') || '[]')
        const recentLogs = logs.filter(l => l.bookId === 1)
        return recentLogs.length === 2
      }, 'bookId=1 的日志条数: ' + JSON.parse(localStorage.getItem('qushu_delist_logs') || '[]').filter(l => l.bookId === 1).length)

      // 场景 C: 并发购买（不同买家）
      log('\n--- 场景 C: 并发购买 ---')
      const pc3 = simulateProductCache()
      const cart3BuyerA = [{...pc3[10]}]
      const cart3BuyerB = [{...pc3[10]}]  // 同一本书
      const resultA = simulatePlaceOrder(cart3BuyerA, '买家A', '地址A', pc3, null)
      // 买家B 来晚了一步
      const resultB = {
        found: pc3.findIndex(p => p.id === 11) !== -1
      }

      assert('R3-5: 并发场景 - 买家A 成功购买', () => {
        return resultA.orders.length === 1
      })

      assert('R3-6: 并发场景 - 买家B 无法找到已售书', () => {
        return resultB.found === false
      }, '书已被买家A买走，productCache中不存在')

      // 场景 D: 空购物车
      log('\n--- 场景 D: 空购物车 ---')
      const pc4 = simulateProductCache()
      const lenBefore = pc4.length
      simulatePlaceOrder([], '空买家', '地址', pc4, null)
      assert('R3-7: 空购物车不影响 productCache', () => {
        return pc4.length === lenBefore
      })

      // 场景 E: 跨刷新持久化
      log('\n--- 场景 E: 持久化验证 ---')
      assert('R3-8: delisted_ids localStorage 存在', () => {
        const ids = JSON.parse(localStorage.getItem('qushu_delisted_ids') || '[]')
        return ids.length >= 3 // 至少包含前几轮的数据
      }, 'delisted IDs count: ' + JSON.parse(localStorage.getItem('qushu_delisted_ids') || '[]').length)

      assert('R3-9: delist_logs localStorage 存在', () => {
        const logs = JSON.parse(localStorage.getItem('qushu_delist_logs') || '[]')
        return logs.length >= 3
      }, 'delist logs count: ' + JSON.parse(localStorage.getItem('qushu_delist_logs') || '[]').length)

      assert('R3-10: 日志时间戳格式正确', () => {
        const logs = JSON.parse(localStorage.getItem('qushu_delist_logs') || '[]')
        if (logs.length === 0) return false
        return !isNaN(Date.parse(logs[0].timestamp))
      }, '时间戳: ' + (JSON.parse(localStorage.getItem('qushu_delist_logs') || '[]')[0]?.timestamp || 'N/A'))
    }

    log('✅ 测试环境就绪。点击按钮开始测试。')
  </script>
</body>
</html>
