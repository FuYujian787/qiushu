<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>求书 · 校园二手书平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="data.js"></script>
</head>
<body class="flex h-screen overflow-hidden" id="appBody">

<aside class="w-64 bg-white flex flex-col items-center py-8 shadow-sm z-10 flex-shrink-0 sidebar">
  <div class="mb-12 flex flex-col items-center cursor-pointer" onclick="navigateTo('home')">
    <div class="w-16 h-16 bg-gray-100 rounded-2xl flex items-center justify-center mb-3">
      <iconify-icon class="text-purple-600" icon="ph:books-duotone" width="36"></iconify-icon>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 tracking-wider">求书</h1>
  </div>
  <nav class="w-full px-4 space-y-2 flex-grow overflow-y-auto custom-scrollbar" id="sidebarNav">
    <a class="sidebar-item" data-page="home"><iconify-icon class="mr-3" icon="solar:home-2-outline" width="22"></iconify-icon><span>首页</span></a>
    <a class="sidebar-item" data-page="procurement"><iconify-icon class="mr-3" icon="solar:shop-2-outline" width="22"></iconify-icon><span>采购</span></a>
    <a class="sidebar-item" data-page="cart"><iconify-icon class="mr-3" icon="solar:cart-large-2-outline" width="22"></iconify-icon><span>购物车</span></a>
    <a class="sidebar-item" data-page="orders"><iconify-icon class="mr-3" icon="solar:bill-list-outline" width="22"></iconify-icon><span>订单管理</span></a>
    <a class="sidebar-item relative" data-page="notifications"><iconify-icon class="mr-3" icon="solar:bell-bing-outline" width="22"></iconify-icon><span>消息通知</span><span id="notificationBadge" class="absolute right-2 top-2 w-2.5 h-2.5 bg-red-500 rounded-full hidden"></span></a>
    <a class="sidebar-item" data-page="community"><iconify-icon class="mr-3" icon="solar:users-group-two-rounded-outline" width="22"></iconify-icon><span>学习社区</span></a>
    <a class="sidebar-item" data-page="profile"><iconify-icon class="mr-3" icon="solar:user-circle-outline" width="22"></iconify-icon><span>个人中心</span></a>
  </nav>
  <div class="mt-auto px-4 w-full">
    <div class="w-full py-4 bg-purple-100 text-purple-700 rounded-2xl font-bold flex items-center justify-center space-x-2 hover:bg-purple-200 transition-all cursor-pointer" onclick="navigateTo('publish')">
      <iconify-icon icon="solar:add-circle-bold" width="24"></iconify-icon>
      <span>发布闲置</span>
    </div>
  </div>
</aside>

<main class="flex-grow flex flex-col overflow-hidden main-content">
  <header class="h-24 bg-white/50 backdrop-blur-md flex items-center justify-between px-10 flex-shrink-0 border-b border-gray-100 top-header">
    <div>
      <h2 class="text-2xl font-bold text-gray-800" id="greetingMsg">Good Morning, 访客!</h2>
      <p class="text-sm text-gray-400" id="currentDate">今天是 ...</p>
    </div>
    <div class="flex items-center space-x-6">
      <div class="relative group">
        <input class="w-80 h-12 pl-12 pr-4 bg-white border border-gray-100 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 transition-all shadow-sm" placeholder="搜索书名、作者或 ISBN..." type="text" id="globalSearch">
        <iconify-icon class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400" icon="solar:magnifer-linear" width="20"></iconify-icon>
      </div>
      <div class="flex items-center space-x-4 border-l border-gray-200 pl-6">
        <div class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-purple-600 rounded-xl transition-all cursor-pointer"><iconify-icon icon="solar:question-circle-linear" width="24"></iconify-icon></div>
        <div class="w-10 h-10 flex items-center justify-center text-gray-500 hover:text-purple-600 rounded-xl transition-all relative cursor-pointer" onclick="navigateTo('notifications')">
          <iconify-icon icon="solar:bell-linear" width="24"></iconify-icon>
        </div>
        <div class="flex items-center space-x-3 cursor-pointer" onclick="handleAvatarClick()">
          <div class="w-10 h-10 rounded-xl overflow-hidden ring-2 ring-transparent hover:ring-purple-200 transition-all">
            <img id="avatarImg" alt="头像" class="w-full h-full object-cover" src="5492ec47e5014900a8690086552604d9.jpg">
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="flex-grow overflow-y-auto custom-scrollbar p-10" id="pageContainer"></div>
</main>

<script>
(function() {
  const DEFAULT_AVATAR = '5492ec47e5014900a8690086552604d9.jpg';
  const KEYS = {
    users: 'qushu_users',
    publishedBooks: 'qushu_published_books',
    orders: 'qushu_orders',
    notifications: 'qushu_user_notifications',
    userPosts: 'qushu_user_posts',
    loggedInUser: 'qushu_logged_in_user'
  };

  const INIT = window.INITIAL_DATA || {};
  // 预设帖子：始终来自 data.js，不可修改
  const PRESET_POSTS = INIT.communityPosts || [];

  const USERS_FILE = JSON.parse(localStorage.getItem(KEYS.users)) || INIT.users || [];
  const loadData = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch(e) { return fallback; }
  };

  const STATE = {
    currentUser: null,
    cart: [],
    orders: loadData(KEYS.orders, []),
    publishedBooks: loadData(KEYS.publishedBooks, []),
    userNotifications: loadData(KEYS.notifications, {}),
    userPosts: loadData(KEYS.userPosts, []),
    currentPage: 'login',
    isLoggedIn: false,
    procurementFilter: '全部',
    procurementPage: 1,
    searchQuery: ''
  };

  const saveUsers = () => localStorage.setItem(KEYS.users, JSON.stringify(USERS_FILE));
  const savePublishedBooks = () => localStorage.setItem(KEYS.publishedBooks, JSON.stringify(STATE.publishedBooks));
  const saveOrders = () => localStorage.setItem(KEYS.orders, JSON.stringify(STATE.orders));
  const saveNotifications = () => localStorage.setItem(KEYS.notifications, JSON.stringify(STATE.userNotifications));
  const saveUserPosts = () => localStorage.setItem(KEYS.userPosts, JSON.stringify(STATE.userPosts));

  // 更新消息通知小红点
  const updateNotificationBadge = () => {
    const badge = $('#notificationBadge');
    if (!badge) return;
    if (STATE.isLoggedIn && STATE.currentUser) {
      const notifs = STATE.userNotifications[STATE.currentUser.name] || [];
      const hasUnread = notifs.some(n => n.unread);
      badge.classList.toggle('hidden', !hasUnread);
    } else {
      badge.classList.add('hidden');
    }
  };

  // 合并预设帖子与用户帖子
  const getMergedPosts = () => [...PRESET_POSTS, ...STATE.userPosts];

  const IMG_POOL = ['R-C.jpg'];
  const TOTAL_PRODUCTS = 100000;
  let productCache = null;

  const categoryMap = {
    '微积分': '教材', '线性代数': '教材', '大学英语': '教材', '有机化学': '教材',
    '数据结构': '选修', '概率论': '选修', '计算机网络': '选修', '操作系统': '选修',
    '高等数学': '教材', '考研政治': '考研'
  };

  const generateProducts = () => {
    if (productCache) return Promise.resolve(productCache);
    return new Promise((resolve) => {
      setTimeout(() => {
        const subjects = ['微积分', '线性代数', '大学英语', '有机化学', '数据结构', '概率论', '计算机网络', '操作系统', '高等数学', '考研政治'];
        const conditions = ['九成新', '八成新', '全新未拆', '有笔记', '七成新'];
        const products = [];
        for (let i = 0; i < TOTAL_PRODUCTS; i++) {
          const subj = subjects[i % subjects.length];
          products.push({
            id: i + 1,
            title: `${subj} 辅导书 第${Math.floor(i/10)+1}版`,
            author: ['同济大学','清华大学','浙江大学','外研社'][i%4],
            price: (10 + Math.random() * 50).toFixed(1),
            oldPrice: (30 + Math.random() * 80).toFixed(1),
            condition: conditions[i % conditions.length],
            seller: `同学${100 + (i % 900)}`,
            img: IMG_POOL[0],
            category: categoryMap[subj] || '教材',
            isUserPublished: false
          });
        }
        productCache = [...STATE.publishedBooks, ...products];
        resolve(productCache);
      }, 10);
    });
  };

  const getRandomProducts = (count = 20) => {
    if (!productCache) return [];
    const arr = [];
    for (let i = 0; i < count; i++) arr.push(productCache[Math.floor(Math.random() * TOTAL_PRODUCTS)]);
    return arr;
  };

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  const updateHeader = () => {
    const greetEl = $('#greetingMsg');
    const dateEl = $('#currentDate');
    const avatarEl = $('#avatarImg');
    if (!greetEl || !dateEl) return;
    if (STATE.isLoggedIn && STATE.currentUser) {
      const user = STATE.currentUser;
      const hour = new Date().getHours();
      let g = 'Good Morning';
      if (hour >= 12 && hour < 18) g = 'Good Afternoon';
      else if (hour >= 18) g = 'Good Evening';
      greetEl.textContent = `${g}, ${user.name}!`;
      dateEl.textContent = `今天是 ${new Date().toISOString().slice(0,10)}，来看点新书吧`;
      if (avatarEl) avatarEl.src = user.avatar || DEFAULT_AVATAR;
    } else {
      greetEl.textContent = 'Good Morning, 访客!';
      dateEl.textContent = '今天是 ' + new Date().toISOString().slice(0,10) + '，来看点新书吧';
      if (avatarEl) avatarEl.src = DEFAULT_AVATAR;
    }
    updateNotificationBadge();
  };

  window.handleAvatarClick = () => {
    if (STATE.isLoggedIn) navigateTo('profile');
    else navigateTo('login');
  };

  const applyAuthLayout = (isAuthPage) => {
    const body = document.getElementById('appBody');
    if (isAuthPage) body.classList.add('auth-page');
    else body.classList.remove('auth-page');
  };

  const navigateTo = (page, params) => {
    STATE.currentPage = page;
    if (page === 'bookDetail') window.__bookDetailId = params;
    applyAuthLayout(['login', 'register'].includes(page));
    renderCurrentPage();
    if (!['login', 'register'].includes(page)) {
      $$('.sidebar-item').forEach(el => el.classList.remove('sidebar-active'));
      const activeNav = $(`.sidebar-item[data-page="${page}"]`);
      if (activeNav) activeNav.classList.add('sidebar-active');
    }
    if (!['login', 'register'].includes(page) && STATE.isLoggedIn) updateHeader();
  };
  window.navigateTo = navigateTo;

  const renderCurrentPage = () => {
    const container = $('#pageContainer');
    if (!container) return;
    switch (STATE.currentPage) {
      case 'home': renderHome(container); break;
      case 'procurement': renderProcurement(container); break;
      case 'cart': renderCart(container); break;
      case 'orders': renderOrders(container); break;
      case 'notifications': renderNotifications(container); break;
      case 'community': renderCommunity(container); break;
      case 'profile': renderProfile(container); break;
      case 'publish': renderPublish(container); break;
      case 'bookDetail': renderBookDetail(container); break;
      case 'payment': renderPayment(container); break;
      case 'login': renderLogin(container); break;
      case 'register': renderRegister(container); break;
    }
  };

  // ---------- 页面渲染 ----------
  const renderHome = (container) => {
    container.innerHTML = `
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-8 mb-8">
        <div class="lg:col-span-2 bg-white rounded-3xl p-6 shadow-sm">
          <div class="flex justify-between items-center mb-6"><h3 class="text-lg font-bold text-gray-800">官方专区</h3><span class="text-purple-500 text-xs cursor-pointer">查看更多</span></div>
          <div class="grid grid-cols-2 gap-4">
            <div class="p-4 bg-purple-50 rounded-2xl flex flex-col items-center"><iconify-icon class="text-purple-400 mb-2" icon="mdi:school" width="32"></iconify-icon><span class="text-sm font-medium">高教社</span></div>
            <div class="p-4 bg-blue-50 rounded-2xl flex flex-col items-center"><iconify-icon class="text-blue-400 mb-2" icon="mdi:microscope" width="32"></iconify-icon><span class="text-sm font-medium">科学社</span></div>
            <div class="p-4 bg-red-50 rounded-2xl flex flex-col items-center"><iconify-icon class="text-red-400 mb-2" icon="mdi:university" width="32"></iconify-icon><span class="text-sm font-medium">浙大出版社</span></div>
            <div class="p-4 bg-gray-50 rounded-2xl flex flex-col items-center"><iconify-icon class="text-gray-400 mb-2" icon="mdi:dots-horizontal" width="32"></iconify-icon><span class="text-sm font-medium">更多</span></div>
          </div>
        </div>
        <div class="lg:col-span-3 bg-purple-50 rounded-3xl p-6 shadow-sm border border-purple-100">
          <h3 class="text-lg font-bold text-gray-800 mb-6">学习社区</h3>
          <div class="grid grid-cols-2 gap-y-4 gap-x-8" id="homeCommunityTopics"></div>
        </div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-8 mb-8">
        <div class="lg:col-span-3 bg-white rounded-3xl p-8 shadow-sm"><h3 class="text-xl font-bold text-gray-800 mb-4">智慧购书清单</h3><div class="space-y-4" id="smartList"></div></div>
        <div class="lg:col-span-2 bg-white rounded-3xl p-8 shadow-sm"><h3 class="text-xl font-bold text-gray-800 mb-8">热门书本</h3><div id="hotBooks" class="space-y-6"></div></div>
      </div>`;
    generateProducts().then(() => {
      $('#smartList').innerHTML = ['微积分（上册）','线性代数（上册）','有机化学（上册）'].map(n => `
        <div class="flex items-center justify-between p-6 bg-purple-50 rounded-2xl border border-purple-100 cursor-pointer" onclick="navigateTo('procurement')">
          <span class="text-lg font-bold text-gray-700">${n}</span><span class="px-4 py-1.5 bg-purple-600 text-white text-xs font-bold rounded-full">已匹配 20 本</span>
        </div>`).join('');
      const books = getRandomProducts(4);
      $('#hotBooks').innerHTML = books.map(b => `
        <div class="flex items-center space-x-4 p-4 rounded-2xl hover:bg-gray-50 cursor-pointer" onclick="navigateTo('bookDetail',${b.id})">
          <div class="w-16 h-20 bg-gray-100 rounded-lg overflow-hidden"><img src="${b.img}" class="w-full h-full object-cover"></div>
          <div><h4 class="font-bold text-gray-700">${b.title}</h4><p class="text-xs text-gray-400">${b.condition}</p><p class="text-purple-600 font-bold mt-2">¥${b.price}</p></div>
        </div>`).join('');
      // 首页社区话题：使用合并后的帖子，取前4条
      const posts = getMergedPosts().slice(0, 4);
      $('#homeCommunityTopics').innerHTML = posts.map(p => `
        <div class="flex items-center space-x-3"><span class="w-2 h-2 rounded-full bg-purple-400"></span><span class="text-sm text-gray-600 cursor-pointer hover:text-purple-600" onclick="navigateTo('community')">${p.title}</span></div>`).join('');
    });
  };

  // 采购页面
  const renderProcurement = (container) => {
    container.innerHTML = `
      <div class="mb-8"><div class="flex items-center space-x-4"><span class="text-sm font-bold text-gray-400">分类:</span><div class="flex flex-wrap gap-2" id="filterChips"></div></div></div>
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6" id="procurementGrid"></div>
      <div class="mt-10 flex flex-col items-center space-y-4" id="paginationContainer"></div>`;
    generateProducts().then(() => {
      const filter = STATE.procurementFilter;
      const searchQuery = STATE.searchQuery?.trim().toLowerCase() || '';
      const page = STATE.procurementPage;
      const pageSize = 20;
      let filtered = productCache;
      if (filter !== '全部') filtered = productCache.filter(p => p.category === filter);
      if (searchQuery) filtered = filtered.filter(p => p.title.toLowerCase().includes(searchQuery) || p.author.toLowerCase().includes(searchQuery));
      const totalPages = Math.ceil(filtered.length / pageSize) || 1;
      if (page > totalPages) STATE.procurementPage = totalPages;
      const start = (STATE.procurementPage - 1) * pageSize;
      const paged = filtered.slice(start, start + pageSize);
      document.getElementById('globalSearch').value = STATE.searchQuery || '';
      $('#filterChips').innerHTML = ['全部','教材','考研','选修'].map(c => `<span class="filter-chip ${c===filter?'active':''} px-4 py-1.5 rounded-full text-sm font-medium bg-white border border-gray-100 text-gray-600 hover:border-purple-300" onclick="window.setProcurementFilter('${c}')">${c}</span>`).join('');
      $('#procurementGrid').innerHTML = paged.length ? paged.map(b => bookCardHTML(b)).join('') : '<div class="col-span-full text-center py-20 text-gray-400">没有找到相关书籍</div>';
      let pagHTML = '';
      if (totalPages > 1) {
        pagHTML += `<div class="flex items-center space-x-2"><button class="w-10 h-10 rounded-xl border border-gray-200 flex items-center justify-center text-gray-400 page-btn" onclick="window.goToProcurementPage(${page-1})" ${page<=1?'disabled':''}>‹</button>`;
        const maxV = 5;
        let sp = Math.max(1, page - Math.floor(maxV/2));
        let ep = Math.min(totalPages, sp + maxV - 1);
        if (ep - sp < maxV-1) sp = Math.max(1, ep - maxV + 1);
        if (sp > 1) { pagHTML += `<button class="w-10 h-10 rounded-xl border border-gray-200 flex items-center justify-center text-gray-500 page-btn" onclick="window.goToProcurementPage(1)">1</button>`; if (sp>2) pagHTML += '<span class="w-10 h-10 flex items-center justify-center text-gray-400">…</span>'; }
        for (let i=sp; i<=ep; i++) pagHTML += `<button class="w-10 h-10 rounded-xl flex items-center justify-center font-bold page-btn ${i===page?'bg-purple-600 text-white':'border border-gray-200 text-gray-500'}" onclick="window.goToProcurementPage(${i})">${i}</button>`;
        if (ep < totalPages) { if (ep < totalPages-1) pagHTML += '<span class="w-10 h-10 flex items-center justify-center text-gray-400">…</span>'; pagHTML += `<button class="w-10 h-10 rounded-xl border border-gray-200 flex items-center justify-center text-gray-500 page-btn" onclick="window.goToProcurementPage(${totalPages})">${totalPages}</button>`; }
        pagHTML += `<button class="w-10 h-10 rounded-xl border border-gray-200 flex items-center justify-center text-gray-400 page-btn" onclick="window.goToProcurementPage(${page+1})" ${page>=totalPages?'disabled':''}>›</button></div>`;
        pagHTML += `<div class="flex items-center space-x-2 text-sm text-gray-500"><span>跳至</span><input type="number" min="1" max="${totalPages}" id="jumpPageInput" class="w-16 px-2 py-1 border border-gray-200 rounded-lg text-center text-sm" placeholder="${page}"><span>页</span><button class="px-3 py-1 bg-purple-100 text-purple-700 rounded-lg text-sm font-medium hover:bg-purple-200" onclick="window.jumpToProcurementPage()">GO</button></div>`;
      }
      $('#paginationContainer').innerHTML = pagHTML;
    });
  };
  window.setProcurementFilter = (cat) => { STATE.procurementFilter = cat; STATE.procurementPage = 1; renderCurrentPage(); };
  window.goToProcurementPage = (p) => {
    if (!productCache) return;
    const filter = STATE.procurementFilter;
    let filtered = productCache;
    if (filter !== '全部') filtered = productCache.filter(b => b.category === filter);
    const q = STATE.searchQuery?.trim().toLowerCase() || '';
    if (q) filtered = filtered.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q));
    const total = Math.ceil(filtered.length / 20) || 1;
    if (p < 1) p = 1; else if (p > total) p = total;
    STATE.procurementPage = p;
    renderCurrentPage();
  };
  window.jumpToProcurementPage = () => {
    const inp = document.getElementById('jumpPageInput');
    if (inp && !isNaN(parseInt(inp.value))) window.goToProcurementPage(parseInt(inp.value));
  };

  const bookCardHTML = (book) => `
    <div class="bg-white rounded-3xl p-4 shadow-sm hover:shadow-md transition-shadow cursor-pointer" onclick="navigateTo('bookDetail',${book.id})">
      <div class="relative aspect-[3/4] bg-gray-50 rounded-2xl mb-4 overflow-hidden"><img src="${book.img}" class="w-full h-full object-cover"><span class="absolute top-3 left-3 px-3 py-1 bg-black/50 text-white text-[10px] font-bold rounded-full">${book.condition}</span></div>
      <div><div class="flex justify-between items-start mb-2"><h4 class="font-bold text-gray-800 line-clamp-2">${book.title}</h4><span class="text-purple-600 font-bold ml-2">¥${book.price}</span></div>
      <p class="text-xs text-gray-400 mb-4">卖家: ${book.seller}</p>
      <div onclick="event.stopPropagation()"><div class="w-full py-2.5 bg-gray-100 text-gray-700 text-xs font-bold rounded-xl hover:bg-purple-100 text-center cursor-pointer" onclick="addToCart(${book.id})">加入购物车</div></div></div>
    </div>`;

  window.addToCart = (id) => {
    const book = productCache.find(b => b.id === id);
    if (!book) return;
    const exist = STATE.cart.find(i => i.id === id);
    if (exist) exist.qty++;
    else STATE.cart.push({...book, qty: 1});
    alert('已加入购物车');
  };

  // 购物车
  const renderCart = (container) => {
    const total = STATE.cart.reduce((s,i) => s + parseFloat(i.price)*i.qty, 0).toFixed(2);
    container.innerHTML = `
      <div class="flex flex-col lg:flex-row gap-8">
        <div class="flex-grow bg-white rounded-3xl p-8 shadow-sm"><h3 class="text-xl font-bold mb-6">我的购物车</h3><div id="cartItems"></div></div>
        <div class="w-full lg:w-96 bg-white rounded-3xl p-8 shadow-sm"><h3 class="text-xl font-bold mb-6">订单摘要</h3>
          <div class="flex justify-between mb-4"><span>商品总价</span><span>¥${total}</span></div>
          <div class="pt-6 border-t"><div class="flex justify-between"><span>应付总额</span><span class="text-3xl font-bold text-purple-600">¥${total}</span></div></div>
          <div class="mt-6"><div class="w-full py-4 bg-purple-600 text-white rounded-2xl font-bold text-center cursor-pointer" onclick="proceedToPayment()">去支付</div></div>
        </div>
      </div>`;
    $('#cartItems').innerHTML = STATE.cart.map(item => `
      <div class="flex items-center py-6 border-b"><div class="w-24 h-32 bg-gray-50 rounded-xl overflow-hidden"><img src="${item.img}" class="w-full h-full object-cover"></div>
      <div class="ml-6 flex-grow"><h4 class="font-bold">${item.title}</h4><p class="text-sm text-gray-400">¥${item.price} x ${item.qty}</p></div>
      <div class="cursor-pointer text-red-400" onclick="removeFromCart(${item.id})">删除</div></div>`).join('');
  };

  // 搜索事件
  const handleSearch = (e) => {
    const v = e.target.value.trim();
    if (v) { STATE.searchQuery = v; STATE.procurementPage = 1; navigateTo('procurement'); }
    else if (STATE.searchQuery) { STATE.searchQuery = ''; if (STATE.currentPage === 'procurement') { STATE.procurementPage = 1; renderCurrentPage(); } }
  };

  // 初始化
  window.addEventListener('DOMContentLoaded', () => {
    $('#currentDate').textContent = '今天是 ' + new Date().toISOString().slice(0,10) + '，来看点新书吧';
    generateProducts().then(() => {
      // 尝试恢复登录状态
      const savedUsername = localStorage.getItem(KEYS.loggedInUser);
      if (savedUsername) {
        const user = USERS_FILE.find(u => u.name === savedUsername);
        if (user) {
          STATE.currentUser = {...user};
          STATE.isLoggedIn = true;
          navigateTo('home');
          return;
        }
      }
      navigateTo('login');
    });
    document.getElementById('globalSearch')?.addEventListener('input', handleSearch);
    $$('.sidebar-item').forEach(el => el.addEventListener('click', (e) => {
      e.preventDefault();
      navigateTo(el.dataset.page);
