services:
  # 前端静态站点
  - type: static_site
    name: qiushu-frontend
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: NODE_ENV
        value: production

  # 后端 Flask 服务
  - type: web
    name: qiushu-backend
    runtime: python
    buildCommand: cd server && pip install -r requirements.txt
    startCommand: cd server && python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: qiushu-db
          property: connectionString

# 数据库
databases:
  - name: qiushu-db
    plan: free
    databaseName: qiushu
    user: qiushu_user