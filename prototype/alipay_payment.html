<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>支付宝支付 - 求书校园二手书平台</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
<style>
        body {
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .alipay-blue {
            background: linear-gradient(135deg, #1677ff 0%, #4096ff 100%);
        }
        .purple-accent {
            background-color: #7c3aed;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 is-mb-ai-setting">
<div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
<div class="alipay-blue p-8 text-white text-center">
<div class="flex justify-center mb-4">
<iconify-icon icon="logos:alipay" width="64"></iconify-icon>
</div>
<h2 class="text-xl font-bold italic">支 付 宝支付</h2>
<p class="text-blue-100 mt-1 opacity-80 text-sm tracking-wide">ALIPAY.COM · 安全支付</p>
</div>
<div class="p-8 flex flex-col items-center">
<div class="text-center mb-8">
<p class="text-gray-400 text-sm mb-1">应付总额</p>
<div class="flex items-baseline justify-center">
<span class="text-xl font-bold mr-1 text-gray-800">¥</span>
<span class="text-4xl font-extrabold text-gray-800">60.00</span>
</div>
</div>
<!-- QR Code Placeholder -->
<div class="relative w-64 h-64 bg-white p-2 border-2 border-blue-50 rounded-2xl shadow-xl mb-8 group">
<img alt="Alipay Payment QR Code" class="w-full h-full object-cover rounded-xl" src="https://modao.cc/agent-py/media/generated_images/2026-04-27/1f9d20d4aef94d738ffa369ede216f5d.jpg"/>
<div class="absolute inset-0 flex items-center justify-center bg-white/5 backdrop-blur-[1px]">

</div>
</div>
<div class="bg-blue-50 px-6 py-3 rounded-xl flex items-center space-x-3 mb-8">
<iconify-icon class="text-blue-500" icon="solar:info-circle-bold" width="20"></iconify-icon>
<span class="text-xs text-blue-600 font-medium">请打开支付宝手机 App 扫描二维码支付</span>
</div>
<div class="w-full space-y-4">
<button class="w-full py-4 purple-accent text-white rounded-2xl font-bold hover:opacity-90 transition-all shadow-lg shadow-purple-100" onclick="window.location.href='order_management.html'">
                    我已完成支付
                </button>
<button class="w-full py-4 bg-gray-50 text-gray-500 rounded-2xl font-bold hover:bg-gray-100 transition-all" onclick="window.history.back()">
                    返回修改订单
                </button>
</div>
</div>
<div class="bg-gray-50 p-6 border-t border-gray-100 flex items-center justify-between">

</div>
