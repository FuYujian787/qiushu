<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>注册 - 求书 | 校园二手书平台</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.3.4.3.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.1.0.7.js"></script>
<style>
        body {
            background-color: #f3f2f7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .register-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.1), 0 8px 10px -6px rgba(124, 58, 237, 0.1);
        }
        .input-focus:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
<div class="w-full max-w-md">
<!-- Logo -->
<div class="flex flex-col items-center mb-8">
<div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mb-3 shadow-sm">
<iconify-icon class="text-purple-600" icon="ph:books-duotone" width="36"></iconify-icon>
</div>
<h1 class="text-3xl font-bold text-gray-800 tracking-wider">求书</h1>
<p class="text-gray-400 mt-2">加入我们的智慧书享社区</p>
</div>
<!-- 注册卡片 -->
<div class="register-card p-10 flex flex-col">
<h2 class="text-2xl font-bold text-gray-800 mb-8">创建新账号</h2>
<div class="space-y-4 mb-6">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1.5 ml-1">用户名</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
<iconify-icon icon="solar:user-outline" width="20"></iconify-icon>
</span>
<input class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-100 rounded-xl outline-none transition-all input-focus" placeholder="设置你的用户名" type="text" value="张伟"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1.5 ml-1">设置密码</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
<iconify-icon icon="solar:lock-password-outline" width="20"></iconify-icon>
</span>
<input class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-100 rounded-xl outline-none transition-all input-focus" placeholder="6-16位字母或数字" type="password"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1.5 ml-1">确认密码</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
<iconify-icon icon="solar:lock-password-outline" width="20"></iconify-icon>
</span>
<input class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-100 rounded-xl outline-none transition-all input-focus" placeholder="请再次输入密码" type="password"/>
</div>
</div>
</div>
<div class="flex items-start mb-8">
<input checked="" class="mt-1 w-4 h-4 text-purple-600 rounded border-gray-300 focus:ring-purple-500" id="agree" type="checkbox"/>
<label class="ml-2 text-sm text-gray-500" for="agree">
                    我已阅读并同意 <a class="text-purple-600 font-medium" href="#">《服务协议》</a> 和 <a class="text-purple-600 font-medium" href="#">《隐私协议》</a>
</label>
</div>
<button class="w-full py-4 bg-purple-600 text-white rounded-xl font-bold shadow-lg shadow-purple-200 hover:bg-purple-700 transition-all mb-6" onclick="window.location.href='index.html'">
                注册并登录
            </button>
<div class="text-center">
<span class="text-sm text-gray-400">已有账号？</span>
<a class="text-sm text-purple-600 font-bold ml-1 hover:text-purple-700" href="login.html">前往登录</a>
</div>
</div>
</div>
<!-- 底部版权信息 -->
<footer class="mt-12 text-center text-gray-400 text-xs">
        © 2026 求书校园二手书平台 | 智慧服务支撑 · 当前日期: 2026年04月27日
    </footer>
</body>
</html>
