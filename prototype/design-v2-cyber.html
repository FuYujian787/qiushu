<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求书 · 赛博求是 — 数字孪生校园书店</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap');

  :root {
    --void: #09051A;
    --deep: #120C2E;
    --surface: rgba(255,255,255,0.03);
    --glass: rgba(255,255,255,0.06);
    --glass-hover: rgba(255,255,255,0.1);
    --border: rgba(255,255,255,0.06);
    --neon-blue: #00D4FF;
    --neon-cyan: #00F5FF;
    --neon-purple: #A855F7;
    --neon-pink: #FF6B9D;
    --gold: #FFD700;
    --white: #F0F0FF;
    --muted: #8892B0;
    --font-mono: 'Space Grotesk', 'JetBrains Mono', monospace;
    --font-display: 'Orbitron', 'Space Grotesk', sans-serif;
    --font-body: 'Noto Sans SC', 'Inter', sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; background:var(--void); color:var(--white); }
  body {
    font-family:var(--font-body);
    background:
      radial-gradient(ellipse 120% 80% at 50% 0%, rgba(0,212,255,0.06) 0%, transparent 50%),
      radial-gradient(ellipse 80% 60% at 80% 80%, rgba(168,85,247,0.05) 0%, transparent 50%),
      var(--void);
    min-height:100vh;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== AMBIENT PARTICLES CANVAS ===== */
  #particles {
    position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:0.4;
  }

  /* ===== GLASS NAV ===== */
  .nav {
    position:sticky; top:0; z-index:100;
    background:rgba(9,5,26,0.7);
    backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--border);
    padding:0 2rem;
  }
  .nav-inner {
    max-width:1280px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    height:68px;
  }
  .logo {
    display:flex; align-items:center; gap:0.75rem; text-decoration:none;
  }
  .logo-mark {
    width:44px; height:44px;
    background:linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display);
    font-size:1.2rem; font-weight:700;
    color:var(--void);
    position:relative;
  }
  .logo-mark::after {
    content:''; position:absolute; inset:-2px; border-radius:12px;
    background:linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    opacity:0.4; filter:blur(8px); z-index:-1;
  }
  .logo-text {
    font-family:var(--font-display);
    font-size:1.3rem; font-weight:600; letter-spacing:0.08em;
    color:var(--white);
  }
  .logo-badge {
    font-size:0.65rem; padding:0.15rem 0.5rem;
    border-radius:50px;
    background:rgba(0,212,255,0.12); color:var(--neon-blue);
    border:1px solid rgba(0,212,255,0.25);
    font-family:var(--font-mono); letter-spacing:0.1em;
  }
  .nav-links { display:flex; gap:1.75rem; list-style:none; align-items:center; }
  .nav-links a {
    text-decoration:none; color:var(--muted);
    font-size:0.85rem; font-weight:500;
    transition:color 0.2s; position:relative;
  }
  .nav-links a:hover { color:var(--neon-blue); }
  .nav-links a::after {
    content:''; position:absolute; bottom:-4px; left:0; width:0; height:1px;
    background:var(--neon-blue);
    transition:width 0.3s cubic-bezier(0.16,1,0.3,1);
    box-shadow:0 0 8px var(--neon-blue);
  }
  .nav-links a:hover::after { width:100%; }
  .btn {
    padding:0.5rem 1.25rem; border-radius:8px;
    font-size:0.85rem; font-weight:600; cursor:pointer;
    transition:all 0.25s cubic-bezier(0.16,1,0.3,1);
    border:none; font-family:var(--font-body);
  }
  .btn-ghost {
    background:transparent; color:var(--muted);
  }
  .btn-ghost:hover { color:var(--white); }
  .btn-neon {
    background:linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    color:var(--void); font-weight:700;
    box-shadow:0 0 24px rgba(0,212,255,0.25);
  }
  .btn-neon:hover {
    transform:translateY(-2px);
    box-shadow:0 0 40px rgba(0,212,255,0.4);
  }

  /* ===== HERO ===== */
  .hero {
    position:relative; z-index:1;
    max-width:1280px; margin:0 auto;
    padding:6rem 2rem 5rem; text-align:center;
  }
  .hero-glow {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:500px; height:500px;
    background:radial-gradient(circle, rgba(0,212,255,0.08) 0%, transparent 70%);
    pointer-events:none;
  }
  .hero-tag {
    display:inline-block;
    padding:0.25rem 0.85rem;
    border-radius:50px;
    border:1px solid rgba(0,212,255,0.2);
    background:rgba(0,212,255,0.06);
    font-family:var(--font-mono);
    font-size:0.75rem; letter-spacing:0.15em;
    color:var(--neon-blue);
    margin-bottom:1.5rem;
    text-transform:uppercase;
  }
  .hero-title {
    font-family:var(--font-display);
    font-size:clamp(2.5rem, 5.5vw, 4.5rem);
    font-weight:800; letter-spacing:0.04em;
    line-height:1.15; margin-bottom:1.5rem;
    position:relative;
  }
  .hero-title .gradient {
    background:linear-gradient(135deg, var(--neon-blue), var(--neon-cyan), var(--neon-purple));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .hero-sub {
    font-size:1.05rem; color:var(--muted);
    max-width:540px; margin:0 auto 2.5rem;
    font-weight:300;
  }

  /* SEARCH */
  .search-wrap {
    max-width:620px; margin:0 auto;
    display:flex;
    background:var(--glass);
    border-radius:60px;
    border:1px solid var(--border);
    overflow:hidden;
    backdrop-filter:blur(12px);
    transition:border-color 0.3s, box-shadow 0.3s;
  }
  .search-wrap:focus-within {
    border-color:rgba(0,212,255,0.3);
    box-shadow:0 0 32px rgba(0,212,255,0.08);
  }
  .search-wrap input {
    flex:1; border:none; outline:none;
    padding:1rem 1.5rem;
    background:transparent;
    font-size:0.95rem; font-family:var(--font-body);
    color:var(--white);
  }
  .search-wrap input::placeholder { color:rgba(255,255,255,0.25); }
  .search-wrap button {
    border:none; outline:none;
    background:linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
    color:var(--void);
    padding:0 2rem; font-weight:700; cursor:pointer;
    font-family:var(--font-body);
    font-size:0.9rem;
  }

  /* ===== MAIN ===== */
  .main { position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:0 2rem 4rem; }

  .section-header {
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:2rem; padding-top:1rem;
  }
  .section-num {
    font-family:var(--font-mono);
    font-size:0.75rem; color:var(--neon-blue);
    letter-spacing:0.2em; margin-bottom:0.5rem;
    display:block;
  }
  .section-title {
    font-family:var(--font-display);
    font-size:1.5rem; font-weight:700; letter-spacing:0.04em;
    color:var(--white);
  }
  .section-more {
    font-size:0.85rem; color:var(--muted); text-decoration:none;
    transition:color 0.2s;
  }
  .section-more:hover { color:var(--neon-blue); }

  /* BOOK GRID */
  .book-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:1.25rem;
  }
  .book-card {
    background:var(--surface);
    border-radius:16px;
    border:1px solid var(--border);
    overflow:hidden;
    cursor:pointer;
    transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
    backdrop-filter:blur(8px);
    position:relative;
  }
  .book-card::before {
    content:''; position:absolute; inset:0; border-radius:16px;
    opacity:0;
    background:radial-gradient(ellipse at 50% 0%, rgba(0,212,255,0.05) 0%, transparent 80%);
    transition:opacity 0.35s;
    pointer-events:none;
  }
  .book-card:hover { transform:translateY(-8px); border-color:rgba(0,212,255,0.2); }
  .book-card:hover::before { opacity:1; }
  .book-cover {
    height:180px;
    background:linear-gradient(135deg, rgba(0,212,255,0.08), rgba(168,85,247,0.08));
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .cover-pattern {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size:20px 20px;
    mask-image:linear-gradient(to bottom, transparent 20%, black 80%);
  }
  .cover-title {
    font-family:var(--font-display);
    font-size:1rem; font-weight:600;
    color:var(--white);
    opacity:0.6;
    text-align:center; padding:1rem;
    position:relative; z-index:1;
  }
  .cond-badge {
    position:absolute; top:0.75rem; right:0.75rem;
    padding:0.2rem 0.6rem; border-radius:50px;
    font-size:0.65rem; font-weight:600;
    font-family:var(--font-mono);
    z-index:2;
  }
  .cond-new { background:rgba(0,245,255,0.12); color:var(--neon-cyan); }
  .cond-good { background:rgba(168,85,247,0.12); color:var(--neon-purple); }
  .book-info { padding:1rem 1.25rem 1.25rem; }
  .book-title {
    font-size:0.95rem; font-weight:600; margin-bottom:0.25rem;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    color:var(--white);
  }
  .book-meta { font-size:0.8rem; color:var(--muted); margin-bottom:0.75rem; }
  .book-footer { display:flex; align-items:center; justify-content:space-between; }
  .book-price {
    font-family:var(--font-mono);
    font-size:1.2rem; font-weight:700;
    color:var(--neon-blue);
  }
  .book-seller {
    font-size:0.75rem; color:var(--muted);
    display:flex; align-items:center; gap:0.4rem;
  }

  /* ===== FORUM PREVIEW ===== */
  .forum-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:1.25rem;
  }
  .forum-card {
    background:var(--surface);
    border-radius:16px; border:1px solid var(--border);
    padding:1.25rem;
    backdrop-filter:blur(8px);
    transition:all 0.3s;
    cursor:pointer;
  }
  .forum-card:hover { border-color:rgba(168,85,247,0.2); }
  .forum-tag {
    display:inline-block; padding:0.15rem 0.6rem;
    border-radius:50px; font-size:0.7rem; font-weight:600;
    font-family:var(--font-mono);
    margin-bottom:0.75rem;
  }
  .tag-course { background:rgba(0,212,255,0.1); color:var(--neon-blue); }
  .tag-review { background:rgba(168,85,247,0.1); color:var(--neon-purple); }
  .tag-wish { background:rgba(255,107,157,0.1); color:var(--neon-pink); }
  .forum-title { font-weight:600; font-size:0.95rem; margin-bottom:0.5rem; color:var(--white); }
  .forum-excerpt { font-size:0.8rem; color:var(--muted); line-height:1.5; margin-bottom:0.75rem; }
  .forum-footer { font-size:0.7rem; color:var(--muted); display:flex; align-items:center; gap:1rem; }

  /* ===== FOOTER ===== */
  .footer {
    position:relative; z-index:1;
    border-top:1px solid var(--border);
    padding:2.5rem 2rem;
    background:rgba(9,5,26,0.6);
  }
  .footer-inner { max-width:1280px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
  .footer-brand { font-family:var(--font-display); font-size:1rem; font-weight:600; color:var(--white); }
  .footer-links { display:flex; gap:2rem; list-style:none; }
  .footer-links a { text-decoration:none; color:var(--muted); font-size:0.8rem; }
  .footer-links a:hover { color:var(--neon-blue); }
  .footer-copy { font-size:0.75rem; color:var(--muted); }

  @media (max-width:768px) {
    .nav-links { display:none; }
    .hero { padding:4rem 1rem 3rem; }
    .book-grid { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); }
    .forum-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="#" class="logo">
      <div class="logo-mark">Q</div>
      <span class="logo-text">求书</span>
      <span class="logo-badge">BETA</span>
    </a>
    <ul class="nav-links">
      <li><a href="#">首页</a></li>

    </ul>
    <div>
      <button class="btn btn-ghost">登录</button>
      <button class="btn btn-neon">注册</button>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-glow"></div>
  <span class="hero-tag">&lt; ZJU · 数字孪生校园书店 /&gt;</span>
  <h1 class="hero-title">
    在知识的<span class="gradient">量子态</span>中<br>找到你的下一本书
  </h1>
  <p class="hero-sub">
    AI驱动的浙大校内二手书交易平台。从课表到书架，从求书到结缘——一切都在数字空间中无缝流转。
  </p>
  <div class="search-wrap">
    <input type="text" placeholder="搜索书名 / 作者 / ISBN / 课程代码…" aria-label="搜索">
    <button>⌘ 搜索</button>
  </div>
</section>

<!-- MAIN -->
<main class="main">
  <!-- BOOKS -->
  <div class="section-header">
    <div>
      <span class="section-num">01 /</span>
      <h2 class="section-title">热门在售</h2>
    </div>
    <a href="#" class="section-more">浏览全部 ···→</a>
  </div>
  <div class="book-grid" id="bookGrid"></div>

  <!-- FORUM -->
  <div class="section-header" style="padding-top:4rem;">
    <div>
      <span class="section-num">02 /</span>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-inner">
    <span class="footer-brand">求书 · 赛博求是</span>
    <ul class="footer-links">
      <li><a href="#">系统状态</a></li>
      <li><a href="#">API文档</a></li>
      <li><a href="#">社区公约</a></li>
      <li><a href="#">GitHub</a></li>
    </ul>
    <span class="footer-copy">© 2026 求书 — ZJU Digital Campus Bookstore</span>
  </div>
</footer>

<script>
// ===== PARTICLES =====
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let w, h;
const particles = [];
function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize(); window.addEventListener('resize', resize);
for (let i=0; i<40; i++) {
  particles.push({
    x:Math.random()*w, y:Math.random()*h,
    vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3,
    r:Math.random()*1.5+0.5,
    o:Math.random()*0.4+0.1
  });
}
function draw() {
  ctx.clearRect(0,0,w,h);
  particles.forEach((p,i) => {
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=w; if(p.x>w)p.x=0; if(p.y<0)p.y=h; if(p.y>h)p.y=0;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(0,212,255,${p.o})`; ctx.fill();
    particles.forEach((p2,j) => {
      if(j<=i) return;
      const dx=p.x-p2.x, dy=p.y-p2.y, dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<120) {
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p2.x,p2.y);
        ctx.strokeStyle = `rgba(0,212,255,${0.04*(1-dist/120)})`;
        ctx.stroke();
      }
    });
  });
  requestAnimationFrame(draw);
}
draw();

// ===== BOOK DATA =====
const books = [
  {t:'线性代数（第七版）',a:'同济大学数学系',p:18,c:'良好',cat:'数学',s:'李同学'},
  {t:'计算机组成与设计',a:'Patterson & Hennessy',p:45,c:'有笔记',cat:'计算机',s:'王同学'},
  {t:'高等数学（第七版）',a:'同济大学数学系',p:15,c:'良好',cat:'数学',s:'张同学'},
  {t:'新概念英语4',a:'Alexander',p:12,c:'全新',cat:'外语',s:'赵同学'},
  {t:'数据结构（C语言版）',a:'严蔚敏',p:20,c:'良好',cat:'计算机',s:'陈同学'},
  {t:'Python编程从入门到实践',a:'Eric Matthes',p:28,c:'有笔记',cat:'计算机',s:'刘同学'},
  {t:'微观经济学（第九版）',a:'曼昆',p:35,c:'良好',cat:'经济',s:'周同学'},
  {t:'大学物理（上）',a:'张三慧',p:22,c:'良好',cat:'理工',s:'吴同学'},
];

const forums = [
  {tag:'选课求助',tc:'tag-course',title:'《机器学习》和《深度学习》选哪个？',excerpt:'计院大三，下学期想选一门AI方向的专业选修课。周志华老师的《机器学习》和李飞飞老师的…有没有上过的同学给点建议？',replies:23,views:156},
  {tag:'书评',tc:'tag-review',title:'《设计模式》这本书真的值得买吗？',excerpt:'豆瓣评分很高，但是很多人说GoF那本太老了。不知道浙大软工的课程用不用得到？求真实的评价',replies:15,views:89},
  {tag:'求书',tc:'tag-wish',title:'急求《信号与系统》第二版！',excerpt:'信电大二，下学期必修课。学长学姐们有用过的二手书吗？有笔记的最好，价格好商量~',replies:8,views:342},
  {tag:'资料分享',tc:'tag-course',title:'线性代数期末复习资料整理',excerpt:'整理了历年期末考试真题+习题集答案。PDF打包好了，有需要的同学自取~',replies:56,views:1203},
];

document.getElementById('bookGrid').innerHTML = books.map(b=>`
  <article class="book-card">
    <div class="book-cover">
      <div class="cover-pattern"></div>
      <span class="cover-title">${b.t.slice(0,6)}</span>
      <span class="cond-badge ${b.c==='良好'?'cond-good':'cond-new'}">${b.c}</span>
    </div>
    <div class="book-info">
      <div class="book-title">${b.t}</div>
      <div class="book-meta">${b.a}</div>
      <div class="book-footer">
        <span class="book-price">¥${b.p}</span>
        <span class="book-seller">● ${b.s}</span>
      </div>
    </div>
  </article>
`).join('');

document.getElementById('forumGrid').innerHTML = forums.map(f=>`
  <div class="forum-card">
    <span class="forum-tag ${f.tc}">${f.tag}</span>
    <div class="forum-title">${f.title}</div>
    <div class="forum-excerpt">${f.excerpt}</div>
    <div class="forum-footer">
      <span>💬 ${f.replies} 回复</span>
      <span>👁 ${f.views} 浏览</span>
    </div>
  </div>
`).join('');
</script>

</body>
